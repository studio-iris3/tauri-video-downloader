name: Studio Iris Cue Player Spotlight
on:
  push:
    branches: [feature/auto-promotion]
    paths: ['.github/workflows/promotion-spotlight.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Publish launch announcement
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          cd auto-promotion
          python3 - <<'PY'
          from check import query
          import json
          ids=[]
          for org in query("query { account { organizations { id } } }")["account"]["organizations"]:
              for c in query("query { channels(input: {organizationId: "+json.dumps(org["id"])+"}) { id name service } }")["channels"]:
                  if c["name"].strip().lower().lstrip("@")=="studioirissyo" and c["service"].lower() in ("twitter","x"):
                      ids.append(c["id"])
          if len(ids)!=1:
              raise SystemExit("Unexpected channel")
          post="本番中、再生したい素材を探して焦ったことはありませんか？ Stream Deck Cue Playerなら、動画・音声・静止画のポン出しを手元から。Windows・Mac対応。まずは試用版で操作感をチェック！\\nhttps://studioiris-27abm.stores.jp/\\n#StreamDeck #ライブ配信"
          q='mutation { createPost(input: {text: '+json.dumps(post,ensure_ascii=False)+', channelId: '+json.dumps(ids[0])+', schedulingType: automatic, mode: shareNow}) { ... on PostActionSuccess { post { id } } ... on MutationError { message } } }'
          result=query(q)["createPost"]
          if not result.get("post"):
              raise SystemExit("Buffer rejected post")
          print("Buffer accepted post:",result["post"]["id"])
          PY
