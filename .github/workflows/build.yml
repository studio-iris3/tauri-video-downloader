name: Build Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-v2-current
      - cleanup-universal-bin
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            args: --target universal-apple-darwin

          - platform: windows-latest
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      # Windows build時のみ Windows用バイナリをbundle
      - name: Configure bundle resources for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tauri.conf.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["bundle"]["resources"] = [
              "bin/ffmpeg-x86_64-pc-windows-msvc.exe",
              "bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          ]

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-iris-video-downloader-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**

      - name: Upload files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz