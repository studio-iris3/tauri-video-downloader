[package]
name = "tauri-video-downloader"
version = "1.2.1"
description = "Studio Iris Video Downloader"
authors = ["Studio Iris"]
edition = "2021"

[lib]
name = "tauri_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tauri-plugin-opener = "2.5.4"

